server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: route all unknown paths to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Serve product images from mounted volume
    location /images/ {
        alias /usr/share/nginx/images/;
        expires 30d;
        add_header Cache-Control "public";
    }
}
